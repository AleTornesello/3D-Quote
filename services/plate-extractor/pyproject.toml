[project]
name = "plate-extractor"
version = "0.1.0"
description = "Extracts per-plate print time, filament usage and thumbnails from sliced .gcode.3mf archives."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi", "python-multipart", "defusedxml"]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"
